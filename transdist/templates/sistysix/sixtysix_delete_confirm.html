{% extends "index.html" %} {% load humanize %} {% block content %}
<div class="container">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title m-0">Delete Confirmation</h5>
        </div>
        <div class="card-body">
          <div class="card">
            <div class="card-header"></div>
            <!-- /.card-header -->
            <!-- form start -->
            <form action="" method="POST">
              {% csrf_token %}
              <p>Are You Sure You Want to delete customer inspection for customer {{ object }} ?. Kindly note all inspection data will be lost.</p>
              <a href="{% url 'transdist:sixtysix-customers' %}" class="btn btn-info">
                Go Back
              </a>
              <input type="submit" value="Confirm" class="btn btn-warning" />
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- /.col-md-6 -->
  </div>
  <!-- /.row -->
</div>
<!-- /.container-fluid -->

{% endblock content %}
