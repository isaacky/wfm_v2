{% extends "index.html" %}
{% load humanize %}

{% block content %}
<div class="container-fluid">
    <h2 class="text-center display-4 text-uppercase text-bold">Search By Transmission Line</h2>
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="input-group input-group-lg">
                <input type="text"
                       name="keyword"
                       class="form-control form-control-lg"
                       placeholder="Type The Transmission Line here..."
                       hx-get="{% url 'transmission:search-by-txline' %}"
                       hx-trigger="keyup changed delay:300ms"
                       hx-target="#search-results"
                       hx-indicator=".progress">

                <div class="input-group-append">
                    <span class="input-group-text"><i class="fa fa-search"></i></span>
                </div>
            </div>
            <div class="progress htmx-indicator" style="height: 2px;">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 100%"></div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-body p-0 table-responsive" style="height: 500px">
                    <table class="table table-sm table-bordered">
                        <thead>
                            <tr>
                                <th style="width: 10px">#</th>
                                <th>TRANSMISSION LINE</th>
                            </tr>
                        </thead>
                        <tbody id="search-results">
                            {% include 'transmission/tx_autocomplete.html' %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
